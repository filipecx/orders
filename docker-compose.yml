services:
  redis:
    image: redis:7-alpine
    container_name: orders-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - orders-network

volumes:
  redis_data:
    driver: local

networks:
  orders-network:
    driver: bridge
